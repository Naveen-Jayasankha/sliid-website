name: Build SLIID Admin APK

on:
  push:
    branches:
      - android-app-build
    paths:
      - "android-admin/**"
      - ".github/workflows/build-sliid-admin-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-admin/**"
      - ".github/workflows/build-sliid-admin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore notification sound
        run: |
          base64 --decode android-admin/app/src/main/res/raw/sliid_alert.wav.b64 > android-admin/app/src/main/res/raw/sliid_alert.wav

      - name: Build debug APK
        run: gradle --no-daemon -p android-admin assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sliid-admin-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

